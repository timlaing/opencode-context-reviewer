name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube quality gate
    # Scanning stays skipped until the SonarCloud project exists and this
    # repository has `vars.SONAR_ENABLED=true` plus the `SONAR_TOKEN` secret.
    # Once enabled, a missing or invalid token fails loudly instead of
    # silently reporting a green run that never scanned.
    if: vars.SONAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require SonarQube credentials
        if: env.SONAR_TOKEN == ''
        run: exit 1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      # --ignore-scripts: no third-party lifecycle code executes.
      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      # Builds dist/ (the analyzed sources) and writes coverage/lcov.info
      # from the same suite CI runs, so the reported coverage matches the
      # tested artifact.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: SonarQube Scan (branch)
        if: github.event_name != 'pull_request'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >-
            -Dsonar.projectKey=timlaing_opencode-context-reviewer
            -Dsonar.organization=timlaing
            -Dsonar.projectName=opencode-context-reviewer
            -Dsonar.sources=dist,scripts
            -Dsonar.tests=test
            -Dsonar.exclusions=**/node_modules/**,**/coverage/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

      - name: SonarQube Scan (pull request)
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >-
            -Dsonar.projectKey=timlaing_opencode-context-reviewer
            -Dsonar.organization=timlaing
            -Dsonar.projectName=opencode-context-reviewer
            -Dsonar.sources=dist,scripts
            -Dsonar.tests=test
            -Dsonar.exclusions=**/node_modules/**,**/coverage/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}
            -Dsonar.pullrequest.provider=github
            -Dsonar.pullrequest.github.repository=${{ github.repository }}
            -Dsonar.qualitygate.wait=true
