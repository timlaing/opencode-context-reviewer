name: Feature request
description: Suggest a change to the plugin or its OpenCode configuration.
title: '[Feature]: '
labels: [enhancement, needs-triage]
body:
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Redaction and secret patterns
        - Transcript reduction and summaries
        - HTTP and WebSocket enforcement
        - Options and policy validation
        - Plugin loading and hook registration
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the task you cannot currently complete.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Requested behavior
      description: Describe the desired outcome and any example configuration. Note that the plugin is fail-closed by design and has no fail-open toggle.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: acceptance
    attributes:
      label: How to verify the feature
      description: Describe an observable result that would show the change works.
