name: Bug report
description: Report an OpenCode context-reviewer plugin problem. Report OpenCode core problems in the OpenCode repository.
title: '[Bug]: '
labels: [bug, needs-triage]
body:
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Redaction and secret patterns
        - Transcript reduction and summaries
        - HTTP and WebSocket enforcement
        - Options and policy validation
        - Plugin loading and hook registration
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions and environment
      description: Include the repository revision, OS, OpenCode, Node and provider/model where relevant.
      placeholder: 'OS: ...; OpenCode: ...; Node: ...; provider/model: ...; revision: ...'
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest set of commands or actions that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and relevant error
      description: Include a short error excerpt. The plugin's own errors are fixed strings and never contain payload data.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Sanitized configuration
      description: Include the plugin entry and the options you set. Replace literal strings, tokens, credentials, private keys and sensitive hostnames/addresses with placeholders.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked for an existing matching issue.
          required: true
        - label: I removed credentials, literal secret values and sensitive deployment information from this report.
          required: true
